name: Security dependency upgrade and validation (lifecycle type fixes)

on:
  workflow_dispatch:
  push:
    branches:
      - security/hardening-review
    paths:
      - .github/workflows/security-dependency-upgrade.yml

permissions:
  contents: write

concurrency:
  group: security-dependency-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-review

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js to patched maintenance release
        run: npm install --save-exact next@15.5.28 eslint-config-next@15.5.28

      - name: Commit refreshed dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Next.js to patched 15.5.28"
            git fetch origin security/hardening-review
            git rebase origin/security/hardening-review
            git push origin HEAD:security/hardening-review
          fi

      - name: Build with type and lint checks enabled
        run: npm run build

      - name: Run automated tests
        run: npm run test:run

      - name: Report dependency vulnerabilities
        continue-on-error: true
        run: |
          npm audit --json > /tmp/full-audit.json || true
          npm audit --omit=dev --json > /tmp/production-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['all', '/tmp/full-audit.json'], ['production', '/tmp/production-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(label + ' totals:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              if (['high', 'critical'].includes(item.severity)) {
                console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable }));
              }
            }
          }
          NODE
