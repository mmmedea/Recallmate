name: Security dependency upgrade

on:
  push:
    branches:
      - security/hardening-review
    paths:
      - .github/workflows/security-dependency-upgrade.yml

permissions:
  contents: write

concurrency:
  group: security-dependency-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-review

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Upgrade Next.js to patched maintenance release
        run: npm install --save-exact next@15.5.28 eslint-config-next@15.5.28

      - name: Commit refreshed dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade Next.js to patched 15.5.28"
            git fetch origin security/hardening-review
            git rebase origin/security/hardening-review
            git push origin HEAD:security/hardening-review
          fi

      - name: Build with type and lint checks enabled
        run: npm run build

      - name: Run automated tests
        run: npm run test:run

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
