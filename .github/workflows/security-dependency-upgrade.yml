name: Security validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build with type and lint checks
        run: npm run build

      - name: Run automated tests
        run: npm run test:run

      - name: Report dependency vulnerabilities
        if: always()
        continue-on-error: true
        run: |
          npm audit --json > /tmp/full-audit.json || true
          npm audit --omit=dev --json > /tmp/production-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [label, file] of [['all', '/tmp/full-audit.json'], ['production', '/tmp/production-audit.json']]) {
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch {
              console.log(label + ': audit report unavailable');
              continue;
            }
            console.log(label + ' totals:', JSON.stringify(report.metadata?.vulnerabilities || {}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              if (['high', 'critical'].includes(item.severity)) {
                console.log(JSON.stringify({
                  name,
                  severity: item.severity,
                  direct: item.isDirect,
                  range: item.range,
                  fixAvailable: item.fixAvailable
                }));
              }
            }
          }
          NODE
